name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: "true"
  NODE_ENV: test
  DATABASE_URL: postgresql://xfarm:xfarm_secret@localhost:5432/xfarm_test?schema=public
  DATABASE_URL_TEST: postgresql://xfarm:xfarm_secret@localhost:5432/xfarm_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: super-secret-jwt-key-change-in-production-32chars
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  API_PORT: 4100
  WEB_URL: http://localhost:3100
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  NEXT_PUBLIC_API_URL: http://localhost:4100/api/v1
  MINIO_ENDPOINT: localhost
  MINIO_PORT: 9010
  MINIO_ACCESS_KEY: xfarm_minio
  MINIO_SECRET_KEY: xfarm_minio_secret
  MINIO_BUCKET: xfarm-media
  MINIO_USE_SSL: "false"

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xfarm
          POSTGRES_PASSWORD: xfarm_secret
          POSTGRES_DB: xfarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm 9
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm turbo run test

      - name: Deploy Prisma migrations to test DB
        run: pnpm --filter @xfarm/db exec prisma migrate deploy

      - name: Run API E2E tests
        run: pnpm --filter @xfarm/api test:e2e

      - name: Build Web application
        run: pnpm --filter @xfarm/web build

  e2e-ui:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xfarm
          POSTGRES_PASSWORD: xfarm_secret
          POSTGRES_DB: xfarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm 9
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Prisma migrations to test DB
        run: pnpm --filter @xfarm/db exec prisma migrate deploy

      - name: Seed test DB for UI tests
        run: pnpm db:seed

      - name: Install Playwright Chromium
        run: pnpm --filter @xfarm/web exec playwright install --with-deps chromium

      - name: Run Playwright UI tests
        run: pnpm test:ui --reporter=list,html

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            playwright-report/
          retention-days: 7
